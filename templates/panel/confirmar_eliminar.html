{% extends "panel/base_panel.html" %}
{% block heading %}Confirmar eliminación{% endblock %}

{% block panel_content %}
<div class="panel-card">
    <p>¿Está seguro que desea eliminar el {{ tipo }} <strong>{{ obj }}</strong>?</p>
    <p class="panel-hint">Esta acción no se puede deshacer.</p>
    <form method="post" class="panel-form-actions">
        {% csrf_token %}
        <a href="javascript:history.back()" class="panel-btn-ghost">Cancelar</a>
        <button type="submit" class="panel-btn-danger">Eliminar</button>
    </form>
</div>
{% endblock %}
