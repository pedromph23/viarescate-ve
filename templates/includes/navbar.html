{% load static %}
<header class="site-header">
    <nav class="navbar" aria-label="Navegación principal">
        <div class="container navbar-inner">
            <a class="brand" href="/">
                <span class="brand-mark">VR</span>
                <span class="brand-text">
                    <strong>VíaRescate</strong>
                    <small>Venezuela</small>
                </span>
            </a>

            <div class="navbar-actions">
                <button type="button" class="theme-toggle" data-theme-toggle aria-label="Cambiar tema">
                    <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                </button>

                <button class="nav-burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-links" data-nav-burger>
                    <span></span><span></span><span></span>
                </button>
            </div>

            <div class="nav-links" id="nav-links" data-nav-links>
                <a href="/">Inicio</a>
                <a href="{% url 'mapa:publico' %}">Mapa</a>
                <a href="/reportar/" class="nav-highlight">Reportar incidente</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'operaciones:centro' %}">Operaciones</a>
                    {% if user.is_staff or user.is_superuser or user.rol == 'ADMINISTRADOR' or user.rol == 'COORDINADOR' %}
                        <a href="{% url 'panel:dashboard' %}" class="nav-highlight">Administración</a>
                    {% endif %}
                    <form method="post" action="{% url 'usuarios:logout' %}" class="nav-logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-link-btn">Salir</button>
                    </form>
                {% else %}
                    <a href="{% url 'usuarios:login' %}">Entrar</a>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
